# Прод: образ собирает CI (.github/workflows/docker.yml), HTTPS и маршрут
# dz-tracker.ru → studyflow:80 держит Caddy из репозитория sites_configs.
# Разворачивает sites_configs/deploy.sh: IMAGE_TAG — полный sha коммита, по умолчанию latest.
# Портов наружу нет — Caddy ходит в контейнер через общую docker-сеть web.

# Имя закреплено: от него зависят имена томов и контейнеров на сервере.
name: studyflow

services:
  studyflow:
    image: ghcr.io/dnovichkov/studyflow:${IMAGE_TAG:-latest}
    container_name: studyflow
    restart: unless-stopped
    # Значения попадают в config.js при старте контейнера (docker-entrypoint.sh),
    # поэтому образ один на все окружения. Задаются в .env рядом с этим файлом.
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
    healthcheck:
      # 127.0.0.1, а не localhost: nginx слушает только IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web

  # Umami — веб-аналитика без cookies. Выключена, пока не включён профиль analytics:
  # добавьте в .env строки COMPOSE_PROFILES=analytics, UMAMI_DB_PASSWORD и UMAMI_APP_SECRET,
  # и следующий деплой поднимет оба сервиса.
  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    networks:
      - web
      - internal

  umami-db:
    profiles: [analytics]
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

volumes:
  umami-db-data:

networks:
  web:
    external: true
  internal:
    driver: bridge
