# Rate limiting zones (must be in http context, loaded before server blocks)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# In production nginx sits behind Caddy (sites_configs), so every request arrives from the
# proxy's address and all visitors would share one rate-limit bucket. Take the client address
# from X-Forwarded-For, but only when the request comes from a private network, where the proxy
# lives: Caddy sets that header itself and does not pass on a client-supplied one.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
